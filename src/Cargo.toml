[package]
name = "nanai-android-mascot-ui"
version = "0.1.0"
edition = "2024"

[lib]
name = "nanai_android_mascot_ui"
path = "lib.rs"

[dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
rust-i18n = "4.2.4"
sys-locale = "0.3.2"
encoding_rs = "0.8.42"


[[bin]]
name = "nanai_android_mascot_ui_bin"
path = "main.rs"
