[package]
name = "nanai-android-mascot"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nanai_android_mascot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }
cc = "1.11.1"

[dependencies]
tauri = { workspace = true, features = ["tray-icon", "devtools", "specta"] }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
encoding_rs = { workspace = true, features = ["simd-accel", "std"] }
nanai-android-mascot-ui = { workspace = true }
# SHIORI連携用 - C++統合
libc = "0.2.191"
walkdir = "2.5.0"
# 文字列処理とメモリ管理
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
base64 = "0.23.1"
urlencoding = "2.1.3"
toml = "1.2.1"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
md-5 = "0.11.0"
chrono = "0.4.45"
tokio = { version = "1.54.1", features = ["full"] }
parking_lot = "0.13.0"
thiserror = "2.0.21"
anyhow = "1.0.104"
tauri-plugin-dialog = { workspace = true }
wasmi = { workspace = true }
image = "0.25.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
libloading = "0.9.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
