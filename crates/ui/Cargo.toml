[package]
name = "nanai-android-mascot-ui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "nanai_android_mascot_ui"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
rust-i18n = "4.2.4"
sys-locale = "0.3.2"
encoding_rs = "0.8.44"
wasmi = "2.0.0"
nanai-core = { path = "../nanai-core" }
nanai-surface = { path = "../nanai-surface" }
nanai-shiori-vm = { path = "../nanai-shiori-vm" }
nanai-vfs = { path = "../nanai-vfs" }

[dev-dependencies]
serde_json = "1.0.154"


[[bin]]
name = "nanai_android_mascot_ui_bin"
path = "src/main.rs"
