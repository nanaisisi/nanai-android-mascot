[package]
name = "nanai-android-mascot"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nanai_android_mascot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }
cc = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["tray-icon", "devtools", "specta"] }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
encoding_rs = { workspace = true, features = ["simd-accel", "std"] }
nanai-android-mascot-ui = { workspace = true }
# SHIORI連携用 - C++統合
libc = { workspace = true }
walkdir = { workspace = true }
# 文字列処理とメモリ管理
zip = { workspace = true }
base64 = { workspace = true }
urlencoding = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
md-5 = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tauri-plugin-dialog = { workspace = true }
wasmi = { workspace = true }
image = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
libloading = { workspace = true }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
specta-typescript = { workspace = true }
specta = { workspace = true, features = ["derive", "function"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true }
