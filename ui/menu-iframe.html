<!doctype html>
<html lang="ja" data-balloon-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanai Android Mascot Context Menu</title>
    <link rel="stylesheet" href="css/context-menu.css" />
    <script type="module" src="ts/ui/context-menu.ts"></script>
  </head>
  <body class="balloon-theme-default">
    <div class="menu-sidebar" id="menu-sidebar" aria-hidden="true"></div>
    <div class="menu-container" role="menu" aria-label="標準メニュー">
      <!-- ================================================================= -->
      <!-- SSP標準仕様準拠：メイン/サブキャラクター別 コンテキストメニュー構成 -->
      <!-- ================================================================= -->

      <!-- サブキャラクター用専用項目 -->
      <button type="button" class="menu-item subchar-only" id="subchar-talk-btn" data-action="talk" role="menuitem">
        <span>話す(T)</span>
      </button>

      <button type="button" class="menu-item subchar-only" id="hide-subchar-btn" data-action="hide-character" role="menuitem">
        <span>このキャラクターを非表示(H)</span>
      </button>

      <hr class="menu-separator subchar-only" />

      <!-- メインキャラクター専用項目 -->
      <button type="button" class="menu-item main-only" id="friends-btn" role="menuitem">
        <span>おともだち</span>
      </button>

      <button type="button" class="menu-item main-only" id="favorite-btn" role="menuitem">
        <span>おきにいり</span>
      </button>

      <button type="button" class="menu-item main-only" id="update-btn" role="menuitem">
        <span>こうしんCtrl+U</span>
      </button>

      <hr class="menu-separator main-only" />

      <button type="button" class="menu-item main-only" id="uninstall-btn" role="menuitem">
        <span>アンインストール(U)</span>
      </button>

      <hr class="menu-separator main-only" />

      <button type="button" class="menu-item main-only" id="headlines-btn" role="menuitem">
        <span>RSS/ヘッドライン(H)</span>
      </button>

      <button type="button" class="menu-item main-only" id="plugin-btn" role="menuitem" aria-haspopup="true">
        <span>プラグイン(P)</span>
      </button>

      <button type="button" class="menu-item main-only" id="biff-btn" role="menuitem">
        <span>メールチェック (M)</span>
      </button>

      <!-- 共通操作項目 -->
      <button type="button" class="menu-item" id="shell-scale-root-btn" role="menuitem">
        <span>シェル倍率(E)</span>
      </button>

      <button type="button" class="menu-item" id="balloon-scale-btn" role="menuitem">
        <span>バルーン倍率(D)</span>
      </button>

      <button type="button" class="menu-item" id="utility-root-btn" role="menuitem">
        <span>機能(E)</span>
      </button>

      <button type="button" class="menu-item" id="config-btn" role="menuitem">
        <span>設定(Q)</span>
      </button>

      <hr class="menu-separator" />

      <button type="button" class="menu-item" id="ghost-btn" role="menuitem" aria-haspopup="true">
        <span>ゴースト切り替え(G)</span>
      </button>

      <button type="button" class="menu-item" id="call-ghost-btn" role="menuitem">
        <span>他のゴーストを呼ぶ(乙)</span>
      </button>

      <button type="button" class="menu-item" id="shell-btn" role="menuitem" aria-haspopup="true">
        <span>シェル(S)</span>
      </button>

      <button type="button" class="menu-item" id="dressup-btn" role="menuitem" aria-haspopup="true">
        <span>着せ替え(C)</span>
      </button>

      <button type="button" class="menu-item" id="balloon-btn" role="menuitem" aria-haspopup="true">
        <span>バルーン(B)</span>
      </button>

      <button type="button" class="menu-item main-only" id="ghost-history-btn" role="menuitem">
        <span>最近使ったもの(Y)</span>
      </button>

      <hr class="menu-separator main-only" />

      <button type="button" class="menu-item main-only" id="inquire-btn" role="menuitem">
        <span>情報(A)</span>
      </button>

      <button type="button" class="menu-item main-only" id="language-btn" role="menuitem">
        <span>Language</span>
      </button>

      <button type="button" class="menu-item main-only" id="minimize-btn" role="menuitem">
        <span>アイコン化 (1)Ctrl+1</span>
      </button>

      <hr class="menu-separator" />

      <button type="button" class="menu-item main-only" id="move-ghost-btn" role="menuitem">
        <span>ゴースト本体移動</span>
      </button>

      <hr class="menu-separator main-only" />

      <button type="button" class="menu-item" id="close-btn" role="menuitem">
        <span>終了(W)Ctrl+W</span>
      </button>

      <button type="button" class="menu-item main-only" id="close-all-btn" role="menuitem">
        <span>全て終了(X)Ctrl+Q</span>
      </button>
    </div>
  </body>
</html>
