<!doctype html>
<html lang="ja" data-balloon-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanai Android Mascot Context Menu</title>
    <link rel="stylesheet" href="css/context-menu.css" />
    <script type="module" src="ts/ui/context-menu.ts"></script>
  </head>
  <body class="balloon-theme-default">
    <div class="menu-sidebar" id="menu-sidebar" aria-hidden="true"></div>
    <div class="menu-container" role="menu" aria-label="標準メニュー">
      <!-- ================================================================= -->
      <!-- SSP 互換右クリックメニュー階層構造定義 (UKADOC / SSP仕様準拠・絵文字排除) -->
      <!-- ================================================================= -->

      <!-- 0. ゴースト側メニュー -->
      <button
        type="button"
        class="menu-item main-only"
        id="talk-btn"
        role="menuitem"
      >
        <span>もう一度話す (&amp;A)</span>
      </button>

      <button
        type="button"
        class="menu-item main-only"
        id="autotalk-btn"
        role="menuitem"
      >
        <span>自動会話 (&amp;T)</span>
      </button>

      <button
        type="button"
        class="menu-item main-only"
        id="biff-btn"
        role="menuitem"
      >
        <span>メールチェック (&amp;B)</span>
      </button>

      <button
        type="button"
        class="menu-item main-only"
        id="headlines-btn"
        role="menuitem"
      >
        <span>ヘッドラインセンス (&amp;H)</span>
      </button>

      <hr class="menu-separator main-only" />

      <button
        type="button"
        class="menu-item"
        id="dressup-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>着せ替え</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="shell-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>シェル切替</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="ghost-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>ゴースト切替</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="balloon-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>バルーン切替</span>
      </button>

      <hr class="menu-separator" />

      <button
        type="button"
        class="menu-item"
        id="update-btn"
        role="menuitem"
      >
        <span>ネットワーク更新 (&amp;U)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="export-btn"
        role="menuitem"
      >
        <span>ゴースト・バルーン取込</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="uninstall-btn"
        role="menuitem"
      >
        <span>アンインストール</span>
      </button>

      <hr class="menu-separator" />

      <button
        type="button"
        class="menu-item"
        id="inquire-btn"
        role="menuitem"
      >
        <span>情報</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="readme-btn"
        role="menuitem"
      >
        <span>リードミー</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="config-btn"
        role="menuitem"
      >
        <span>設定</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="dev-btn"
        role="menuitem"
      >
        <span>開発者用パネル</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="sakura-script-btn"
        role="menuitem"
      >
        <span>さくらスクリプトテスト</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="plugin-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>プラグイン</span>
      </button>

      <hr class="menu-separator" />

      <button
        type="button"
        class="menu-item"
        id="minimize-btn"
        role="menuitem"
      >
        <span>最小化 (&amp;M)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="close-btn"
        role="menuitem"
      >
        <span>終了 (&amp;E)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="close-all-btn"
        role="menuitem"
      >
        <span>全終了</span>
      </button>
    </div>
  </body>
</html>
