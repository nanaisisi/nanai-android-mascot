<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanai Android Mascot - スプラッシュ</title>
    <link rel="stylesheet" href="splashscreen.css" />
  </head>
  <body>
    <div class="splash-container">
      <img
        src="../assets/tauri.svg"
        alt="Nanai Android Mascot Logo"
        class="logo"
        width="120"
        height="120"
      />
      <h1 class="app-title">Nanai Android Mascot</h1>
      <p class="app-subtitle">デスクトップマスコットアプリケーション</p>

      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>

      <p class="loading-text" id="loading-text">起動中...</p>
    </div>

    <div class="version-info">v0.1.0-desktop-preview</div>

    <div class="feature-preview">
      <p>将来的な機能:</p>
      <ul>
        <li>透過フローティング表示</li>
        <li>複数キャラクター同時表示</li>
        <li>YAYA Shiori連携</li>
        <li>システムトレイ統合</li>
      </ul>
    </div>

    <script type="module" src="splashscreen.js"></script>
  </body>
</html>
