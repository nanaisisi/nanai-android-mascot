# This template contains all of the possible sections and their default values

# Root options
[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # paste is unmaintained
    "RUSTSEC-2024-0436",
    # proc-macro-error is unmaintained
    "RUSTSEC-2024-0370",
    # zvariant is unmaintained (merged into zbus 6.0)
    "RUSTSEC-2026-0370",
    # zbus_names is unmaintained (merged into zbus 6.0)
    "RUSTSEC-2026-0371",
    # zvariant_derive is unmaintained (merged into zbus 6.0)
    "RUSTSEC-2026-0372",
    # async-executor 1.14.0 yanked
    { crate = "async-executor@1.14.0", reason = "Yanked version pulled by zbus 5.19.0 -> tauri-plugin-opener" }
]

[licenses]
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "Zlib",
    "0BSD",
    "BSD-3-Clause",
    "Unicode-3.0",
    "MPL-2.0",
    "BSD-2-Clause",
    "ISC",
    "MIT-0",
    "NCSA",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # Allow Zlib and zlib-acknowledgement for certain crates if they fail with strict SPDX
    { allow = ["Zlib"], crate = "zlib-rs" },
    { allow = ["Zlib"], crate = "flate2" },
]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/nanaisisi/winit.git",
]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
