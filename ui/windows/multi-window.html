<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanai Android Mascot - ウィンドウ管理</title>
    <link rel="stylesheet" href="multi-window.css" />
  </head>
  <body>
    <div class="window-manager">
      <div class="header">
        <h1>ウィンドウ管理センター</h1>
        <p>デスクトップマスコットの各ウィンドウを制御・管理</p>
      </div>

      <div class="global-controls">
        <h2>グローバル制御</h2>
        <div class="global-actions">
          <button type="button" class="btn btn-primary" onclick="initializeAllWindows()">
            全ウィンドウ初期化
          </button>
          <button type="button" class="btn btn-secondary" onclick="minimizeAllWindows()">
            全て最小化
          </button>
          <button type="button" class="btn btn-success" onclick="restoreAllWindows()">
            全て復元
          </button>
          <button type="button" class="btn btn-danger" onclick="closeAllWindows()">
            全て閉じる
          </button>
        </div>
      </div>

      <div class="window-controls">
        <!-- ゴーストウィンドウ -->
        <div class="window-card" id="ghost-window-card">
          <div class="status-indicator" id="ghost-status">停止</div>
          <div class="window-title">
            <span class="window-status" id="ghost-indicator"></span>
            ゴーストウィンドウ
          </div>
          <div class="window-description">
            メインキャラクター表示ウィンドウ。透過・フローティング表示でデスクトップに常駐。
          </div>
          <div class="window-actions">
            <button type="button" class="btn btn-primary" onclick="toggleGhostWindow()">
              開く/閉じる
            </button>
            <button type="button" class="btn btn-secondary" onclick="configureGhostWindow()">
              設定
            </button>
          </div>
        </div>

        <!-- 設定ウィンドウ -->
        <div class="window-card" id="settings-window-card">
          <div class="status-indicator" id="settings-status">停止</div>
          <div class="window-title">
            <span class="window-status" id="settings-indicator"></span>
            設定ウィンドウ
          </div>
          <div class="window-description">
            アプリケーション設定、ゴースト管理、YAYA Shiori設定など。
          </div>
          <div class="window-actions">
            <button type="button" class="btn btn-primary" onclick="toggleSettingsWindow()">
              開く/閉じる
            </button>
            <button type="button" class="btn btn-secondary" onclick="resetSettings()">
              リセット
            </button>
          </div>
        </div>

        <!-- バルーンウィンドウ -->
        <div class="window-card" id="balloon-window-card">
          <div class="status-indicator" id="balloon-status">停止</div>
          <div class="window-title">
            <span class="window-status" id="balloon-indicator"></span>
            バルーンウィンドウ
          </div>
          <div class="window-description">
            メッセージ・台詞表示。ゴーストの近くにフローティング表示。
          </div>
          <div class="window-actions">
            <button type="button" class="btn btn-primary" onclick="testBalloonWindow()">
              テスト表示
            </button>
            <button type="button" class="btn btn-secondary" onclick="configureBalloon()">
              設定
            </button>
          </div>
        </div>

        <!-- YAYA連携ウィンドウ -->
        <div class="window-card" id="yaya-window-card">
          <div class="status-indicator" id="yaya-status">停止</div>
          <div class="window-title">
            <span class="window-status" id="yaya-indicator"></span>
            YAYA連携
          </div>
          <div class="window-description">
            YAYA Shiori DLLとの連携、デバッグ情報表示。
          </div>
          <div class="window-actions">
            <button type="button" class="btn btn-primary" onclick="connectYAYA()">
              接続
            </button>
            <button type="button" class="btn btn-secondary" onclick="debugYAYA()">
              デバッグ
            </button>
          </div>
        </div>
      </div>

      <div class="settings-panel">
        <h2>ウィンドウ設定</h2>

        <div class="settings-row">
          <label for="always-on-top" class="settings-label"
            >常に最前面表示</label
          >
          <div class="settings-value">
            <input
              type="checkbox"
              id="always-on-top"
              onchange="toggleAlwaysOnTop()"
              aria-label="常に最前面表示を切り替え"
            />
          </div>
        </div>

        <div class="settings-row">
          <label for="opacity-slider" class="settings-label">透過度</label>
          <div class="settings-value">
            <input
              type="range"
              id="opacity-slider"
              min="30"
              max="100"
              value="90"
              onchange="updateOpacity()"
              aria-label="ウィンドウの透過度を調整"
            />
            <span id="opacity-value">90%</span>
          </div>
        </div>

        <div class="settings-row">
          <label for="auto-minimize" class="settings-label">自動最小化</label>
          <div class="settings-value">
            <input
              type="checkbox"
              id="auto-minimize"
              onchange="toggleAutoMinimize()"
              aria-label="自動最小化を切り替え"
            />
          </div>
        </div>

        <div class="settings-row">
          <label for="system-tray" class="settings-label"
            >システムトレイ表示</label
          >
          <div class="settings-value">
            <input
              type="checkbox"
              id="system-tray"
              checked
              onchange="toggleSystemTray()"
              aria-label="システムトレイ表示を切り替え"
            />
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="multi-window.js"></script>
  </body>
</html>
