[package]
name = "nanai-android-mascot-ui"
version = "0.1.0"
edition = "2024"

[lib]
name = "nanai_android_mascot_ui"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
rust-i18n = "4.2.4"
sys-locale = "0.3.2"
encoding_rs = "0.8.42"

[dev-dependencies]
serde_json = "1.0.154"


[[bin]]
name = "nanai_android_mascot_ui_bin"
path = "src/main.rs"
