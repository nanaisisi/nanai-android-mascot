<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Android Green to Sakura Pink -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84" />
      <stop offset="100%" stop-color="#FFB7C5" />
    </linearGradient>

    <!-- Soft shadow for the balloon -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- App Icon Base / Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" />

  <g filter="url(#shadow)">
    <!-- Little Android Antennae -->
    <path d="M 180 110 L 140 60" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
    <path d="M 332 110 L 372 60" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>

    <!-- Speech Balloon (Mascot / Ukagaka motif) -->
    <path d="M 256 100
             C 360 100 420 150 420 230
             C 420 310 360 360 256 360
             C 210 360 150 390 100 430
             C 120 380 120 340 105 310
             C 95 285 92 260 92 230
             C 92 150 152 100 256 100 Z"
          fill="#FFFFFF" />
  </g>

  <!-- Text: NSM -->
  <text x="256" y="275" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="105" fill="#3DDC84" text-anchor="middle" letter-spacing="-1">NSM</text>
</svg>