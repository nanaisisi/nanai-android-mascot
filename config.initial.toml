[paths]
default_ghost_dir = "assets/ghost"
fallback_ghost_name = "mock_nanai"
fallback_shell_name = "master"
surfaces_txt = "surfaces.txt"
descript_txt = "descript.txt"

[timing]
random_talk_min = 60000
random_talk_max = 180000
second_change_interval = 1000
long_press_duration = 600
balloon_type_speed = 40

[scale]
ghost_default = 1.0
ghost_min = 0.5
ghost_max = 2.0
balloon_default = 1.0
balloon_min = 0.8
balloon_max = 1.5
step = 0.1

[shiori]
auto_boot = true
second_change_event = true
preferred_dll_names = ["yaya.dll", "shiori.dll", "satoriya.dll"]

# SSP config: conn2.md (ネットワーク更新チェック設定)
[update]
check_on_boot = true
interval_hours = 24
notification_enabled = true

[state]
# 前回読み込んだゴーストの履歴/順序（先頭が直近）
last_ghosts = ["mock_nanai"]
last_ghost = "mock_nanai"
last_shell = "master"
