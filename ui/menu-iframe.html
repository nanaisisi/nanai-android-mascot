<!doctype html>
<html lang="ja" data-balloon-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanai Android Mascot Context Menu</title>
    <link rel="stylesheet" href="css/context-menu.css" />
    <script type="module" src="js/ui/context-menu.js"></script>
  </head>
  <body class="balloon-theme-default">
    <h1 class="visually-hidden">Nanai Android Mascot 標準メニュー</h1>
    <div class="menu-sidebar" id="menu-sidebar" aria-hidden="true"></div>
    <div class="menu-container" role="menu">
      <!-- 0. ゴースト側メニュー -->
      <button
        type="button"
        class="menu-item main-only"
        id="talk-btn"
        role="menuitem"
      >
        <span>💬 もう一度話す (A)</span>
      </button>

      <div class="menu-separator main-only"></div>

      <!-- 1,おすすめ【サブ】 -->
      <button
        type="button"
        class="menu-item"
        id="recommend-btn"
        role="menuitem"
      >
        <span>🔗 おすすめ (R)</span>
      </button>

      <!-- 2,ポータルサイト -->
      <button
        type="button"
        class="menu-item main-only"
        id="portal-btn"
        role="menuitem"
      >
        <span>🌐 ポータルサイト (T)</span>
      </button>

      <!-- 3,ネットワーク更新 -->
      <button
        type="button"
        class="menu-item main-only"
        id="update-btn"
        role="menuitem"
      >
        <span>🔄 ネットワーク更新 (U)</span>
      </button>

      <!-- 4,アンインストール -->
      <button
        type="button"
        class="menu-item main-only"
        id="uninstall-btn"
        role="menuitem"
        data-action="uninstall-ghost"
      >
        <span>🗑️ アンインストール (D)</span>
      </button>

      <!-- 5,RSS/ヘッドライン -->
      <button type="button" class="menu-item main-only" id="headline-btn">
        <span>📰 RSS/ヘッドライン (H)</span>
      </button>

      <!-- 6,プラグイン -->
      <button type="button" class="menu-item main-only" id="plugins-btn">
        <span>🧩 プラグイン (P)</span>
      </button>

      <!-- 7,メールチェック -->
      <button
        type="button"
        class="menu-item main-only"
        id="biff-btn"
        data-action="biff"
        role="menuitem"
      >
        <span>📬 メールチェック (M)</span>
      </button>

      <!-- 8,シェル倍率 -->
      <div class="menu-item-wrapper main-only">
        <button
          type="button"
          class="menu-item has-submenu"
          id="scale-menu-btn"
          role="menuitem"
        >
          <span>🔍 シェル倍率 (S)</span>
        </button>
        <div class="submenu-container">
          <button type="button" class="menu-item" id="scale-50-btn">
            <span>50%</span>
          </button>
          <button type="button" class="menu-item" id="scale-75-btn">
            <span>75%</span>
          </button>
          <button type="button" class="menu-item" id="scale-100-btn">
            <span>100% (標準)</span>
          </button>
          <button type="button" class="menu-item" id="scale-125-btn">
            <span>125%</span>
          </button>
          <button type="button" class="menu-item" id="scale-150-btn">
            <span>150%</span>
          </button>
          <button type="button" class="menu-item" id="scale-200-btn">
            <span>200%</span>
          </button>
        </div>
      </div>

      <!-- 9,機能 -->
      <div class="menu-item-wrapper main-only">
        <button
          type="button"
          class="menu-item has-submenu"
          id="tools-menu-btn"
          role="menuitem"
        >
          <span>🛠️ 機能 (F)</span>
        </button>
        <div class="submenu-container">
          <button type="button" class="menu-item" id="explorer-btn" data-action="explorer">
            <span>🗂 エクスプローラ... (Ctrl+E)</span>
          </button>
          <button type="button" class="menu-item" id="backlog-btn" data-action="backlog">
            <span>📜 バックログ (Ctrl+B)</span>
          </button>
          <div class="menu-separator"></div>
          <button type="button" class="menu-item" id="install-btn" data-action="install">
            <span>📄 ファイルを開く... (Ctrl+O)</span>
          </button>
          <button type="button" class="menu-item" id="open-ghost-folder-btn" data-action="open-ghost-folder">
            <span>📂 エクスプローラでフォルダを開く</span>
          </button>
          <button type="button" class="menu-item" id="scan-btn" data-action="scan">
            <span>🔄 動作情報再読み込み</span>
          </button>
          <button type="button" class="menu-item" id="reload-ghost-btn" data-action="reload-ghost">
            <span>🔄 ゴースト再読み込み</span>
          </button>
          <div class="menu-separator"></div>
          <button type="button" class="menu-item" id="reset-shell-pos-btn" data-action="reset-shell-position">
            <span>📍 シェル位置初期化 (Ctrl+Shift+F12)</span>
          </button>
          <button type="button" class="menu-item" id="reset-balloon-pos-btn" data-action="reset-balloon-position">
            <span>🎈 バルーン位置初期化 (Ctrl+Shift+F10)</span>
          </button>
          <button type="button" class="menu-item" id="close-balloon-btn" data-action="close-balloon">
            <span>❌ バルーンを消す (Ctrl+Shift+Del)</span>
          </button>
          <button type="button" class="menu-item" id="keep-temp-ghost-btn" data-action="keep-temporary-ghost">
            <span>📌 一時起動ゴーストを保持 (Ctrl+K)</span>
          </button>
          <div class="menu-separator"></div>
          <button type="button" class="menu-item" id="debug-btn" data-action="debug">
            <span>🐛 デバッグログ</span>
          </button>
        </div>
      </div>

      <!-- 10,設定 -->
      <button
        type="button"
        class="menu-item main-only"
        id="settings-btn"
        role="menuitem"
      >
        <span>⚙️ 設定 (O)</span>
      </button>

      <!-- 11,ゴースト切り替え -->
      <div class="menu-item-wrapper main-only">
        <button
          type="button"
          class="menu-item has-submenu"
          id="ghost-switch-btn"
          role="menuitem"
        >
          <span>👻 ゴースト切り替え (G)</span>
        </button>
        <div class="submenu-container" id="ghost-submenu">
          <!-- 動的描画 -->
        </div>
      </div>

      <!-- 12,他のゴーストを呼ぶ -->
      <div class="menu-item-wrapper main-only">
        <button
          type="button"
          class="menu-item has-submenu"
          id="call-ghost-btn"
          role="menuitem"
        >
          <span>👥 他のゴーストを呼ぶ (C)</span>
        </button>
        <div class="submenu-container" id="call-ghost-submenu">
          <!-- 動的描画 -->
        </div>
      </div>

      <!-- 13,シェル -->
      <div class="menu-item-wrapper main-only">
        <button
          type="button"
          class="menu-item has-submenu"
          id="shell-switch-btn"
          role="menuitem"
        >
          <span>👗 シェル (S)</span>
        </button>
        <div class="submenu-container" id="shell-submenu">
          <button
            type="button"
            class="menu-item is-current"
            id="shell-master-btn"
          >
            <span>✓ master (通常)</span>
          </button>
        </div>
      </div>

      <!-- 14,着せ替え【サブ】 -->
      <div class="menu-item-wrapper">
        <button
          type="button"
          class="menu-item has-submenu"
          id="dressup-menu-btn"
          role="menuitem"
        >
          <span>🧥 着せ替え (C)</span>
        </button>
        <div class="submenu-container" id="dressup-submenu">
          <!-- 動的描画 (Rust shell_manifest sakura/kero bindgroup) -->
        </div>
      </div>

      <!-- 15,バルーン -->
      <div class="menu-item-wrapper main-only">
        <button
          type="button"
          class="menu-item has-submenu"
          id="balloon-menu-btn"
          role="menuitem"
        >
          <span>💭 バルーン (B)</span>
        </button>
        <div class="submenu-container" id="balloon-submenu">
          <button type="button" class="menu-item" id="balloon-cycle-btn">
            <span>🔄 次のスキンへ切り替え</span>
          </button>
          <div class="menu-separator"></div>
          <button type="button" class="menu-item" id="balloon-theme-ivory-btn">
            <span>アイボリー (Ivory)</span>
          </button>
          <button type="button" class="menu-item" id="balloon-theme-pixel-btn">
            <span>ピクセル (Pixel)</span>
          </button>
          <button type="button" class="menu-item" id="balloon-theme-comic-btn">
            <span>コミック (Comic)</span>
          </button>
          <button type="button" class="menu-item" id="balloon-theme-dark-btn">
            <span>ダーク (Dark)</span>
          </button>
          <div class="menu-separator"></div>
          <div class="menu-item-wrapper">
            <button type="button" class="menu-item has-submenu" id="balloon-scale-menu-btn">
              <span>🔍 バルーン倍率</span>
            </button>
            <div class="submenu-container">
              <button type="button" class="menu-item" id="balloon-scale-50-btn"><span>50%</span></button>
              <button type="button" class="menu-item" id="balloon-scale-75-btn"><span>75%</span></button>
              <button type="button" class="menu-item" id="balloon-scale-100-btn"><span>100% (標準)</span></button>
              <button type="button" class="menu-item" id="balloon-scale-125-btn"><span>125%</span></button>
              <button type="button" class="menu-item" id="balloon-scale-150-btn"><span>150%</span></button>
              <button type="button" class="menu-item" id="balloon-scale-200-btn"><span>200%</span></button>
            </div>
          </div>
        </div>
      </div>

      <!-- 16,最近使ったもの -->
      <div class="menu-item-wrapper main-only">
        <button
          type="button"
          class="menu-item has-submenu"
          id="recent-menu-btn"
          role="menuitem"
        >
          <span>🕘 最近使ったもの</span>
        </button>
        <div class="submenu-container" id="recent-submenu">
          <!-- 動的描画 -->
        </div>
      </div>

      <!-- 17,情報 -->
      <div class="menu-item-wrapper main-only">
        <button
          type="button"
          class="menu-item has-submenu"
          id="info-menu-btn"
          role="menuitem"
        >
          <span>❓ 情報 (A)</span>
        </button>
        <div class="submenu-container">
          <button type="button" class="menu-item" id="help-btn" data-action="help" role="menuitem">
            <span>ℹ️ 本体情報 (A)</span>
          </button>
          <button type="button" class="menu-item" id="ghost-info-btn" data-action="ghost-info" role="menuitem">
            <span>👻 ゴースト情報 (G)</span>
          </button>
          <button
            type="button"
            class="menu-item"
            id="license-btn"
            data-action="license"
            role="menuitem"
          >
            <span>📜 著作権・ライセンス表示 (L)</span>
          </button>
        </div>
      </div>

      <div class="menu-separator"></div>

      <!-- 18,アイコン化 -->
      <button
        type="button"
        class="menu-item main-only"
        id="minimize-btn"
        role="menuitem"
      >
        <span>🗕 アイコン化 (I)</span>
        <span class="shortcut-key">Ctrl+I</span>
      </button>

      <!-- 20,終了【サブ】 -->
      <button type="button" class="menu-item" id="close-btn" role="menuitem">
        <span>✖ 終了 (W)</span>
        <span class="shortcut-key">Ctrl+W</span>
      </button>

      <!-- 21,全て終了【サブ】 -->
      <button
        type="button"
        class="menu-item"
        id="close-all-btn"
        data-action="close-all"
        role="menuitem"
      >
        <span>❌ 全て終了 (X)</span>
        <span class="shortcut-key">Ctrl+Q</span>
      </button>
    </div>
  </body>
</html>
