[package]
name = "nanai-android-mascot-ui"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-wasm-bindgen = "0.6.5"
rust-i18n = "4.2.4"
sys-locale = "0.3.2"
encoding_rs = "0.8.42"

[workspace]
members = ["src-tauri", "src"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
