<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Vibrant Sakura to Soft Sakura -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758F" />
      <stop offset="100%" stop-color="#FFC4D1" />
    </linearGradient>

    <!-- Soft shadow for the balloon, tinted with pink for better blending -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#E04060" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Icon Base / Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" />

  <!-- Android Antennae (Android Green) -->
  <path d="M 180 140 L 130 80" stroke="#3DDC84" stroke-width="28" stroke-linecap="round"/>
  <path d="M 332 140 L 382 80" stroke="#3DDC84" stroke-width="28" stroke-linecap="round"/>

  <!-- Rectangular Speech Balloon (Classic UI style, less chat-app like) -->
  <path d="M 120 150
           h 272
           a 48 48 0 0 1 48 48
           v 136
           a 48 48 0 0 1 -48 48
           h -130
           l -40 50
           l -10 -50
           h -92
           a 48 48 0 0 1 -48 -48
           v -136
           a 48 48 0 0 1 48 -48 Z"
        fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Text: NSM (Android Green) -->
  <text x="256" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="110" fill="#3DDC84" text-anchor="middle" letter-spacing="2">NSM</text>
</svg>