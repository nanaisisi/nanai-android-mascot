<!doctype html>
<html lang="ja" data-balloon-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanai Android Mascot Context Menu</title>
    <link rel="stylesheet" href="css/context-menu.css" />
    <script type="module" src="ts/ui/context-menu.ts"></script>
  </head>
  <body class="balloon-theme-default">
    <div class="menu-sidebar" id="menu-sidebar" aria-hidden="true"></div>
    <div class="menu-container" role="menu" aria-label="標準メニュー">
      <!-- ================================================================= -->
      <!-- SSP 2.x 公式標準右クリックメニュー完全準拠項目定義 (厳密な文面一致) -->
      <!-- ================================================================= -->

      <!-- 0. ゴースト側メニュー -->
      <button
        type="button"
        class="menu-item main-only"
        id="talk-btn"
        role="menuitem"
      >
        <span>前回と同じ話を繰り返す (&amp;A)</span>
      </button>

      <button
        type="button"
        class="menu-item main-only"
        id="autotalk-btn"
        role="menuitem"
      >
        <span>自動会話 (&amp;T)</span>
      </button>

      <button
        type="button"
        class="menu-item main-only"
        id="biff-btn"
        role="menuitem"
      >
        <span>メールチェック (&amp;M)</span>
      </button>

      <button
        type="button"
        class="menu-item main-only"
        id="headlines-btn"
        role="menuitem"
      >
        <span>ヘッドライン (&amp;H)</span>
      </button>

      <hr class="menu-separator main-only" />

      <button
        type="button"
        class="menu-item"
        id="dressup-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>着せ替え (&amp;D)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="shell-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>シェル切替 (&amp;S)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="ghost-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>ゴースト切替 (&amp;G)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="balloon-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>バルーン切替 (&amp;L)</span>
      </button>

      <hr class="menu-separator" />

      <button
        type="button"
        class="menu-item"
        id="update-btn"
        role="menuitem"
      >
        <span>ネットワーク更新 (&amp;U)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="export-btn"
        role="menuitem"
      >
        <span>ファイルからインストール</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="uninstall-btn"
        role="menuitem"
      >
        <span>アンインストール (&amp;X)</span>
      </button>

      <hr class="menu-separator" />

      <button
        type="button"
        class="menu-item"
        id="inquire-btn"
        role="menuitem"
      >
        <span>情報 (&amp;I)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="readme-btn"
        role="menuitem"
      >
        <span>リードミー (&amp;R)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="config-btn"
        role="menuitem"
      >
        <span>設定 (&amp;C)</span>
      </button>

      <hr class="menu-separator" />

      <button
        type="button"
        class="menu-item"
        id="close-btn"
        role="menuitem"
      >
        <span>終了 (&amp;E)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="close-all-btn"
        role="menuitem"
      >
        <span>全て終了</span>
      </button>
    </div>
  </body>
</html>
