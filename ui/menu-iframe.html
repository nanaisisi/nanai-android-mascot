<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanai Android Mascot Context Menu</title>
    <link rel="stylesheet" href="css/context-menu.css" />
    <script type="module" src="ts/ui/context-menu.ts"></script>
  </head>
  <body>
    <div class="menu-sidebar" id="menu-sidebar" aria-hidden="true"></div>
    <div class="menu-container" role="menu" aria-label="標準メニュー">
      <!-- == -->
      <!-- ssp-menu-exact-spec.md 準拠：Scope 0 (メイン) 及び Scope >= 1 (サブ) メニュー構造 -->
      <!-- == -->

      <!-- 共通: おともだち (Scope 0 & Scope >= 1) -->
      <button type="button" class="menu-item" id="friends-btn" role="menuitem">
        <span>おともだち</span>
      </button>

      <!-- メイン専用: おきにいり / こうしん -->
      <button type="button" class="menu-item main-only" id="favorite-btn" role="menuitem">
        <span>おきにいり</span>
      </button>

      <button type="button" class="menu-item main-only" id="update-btn" role="menuitem">
        <span>こうしん</span><span class="shortcut-key">Ctrl+U</span>
      </button>

      <hr class="menu-separator main-only" />

      <!-- メイン専用: アンインストール -->
      <button type="button" class="menu-item main-only" id="uninstall-btn" role="menuitem">
        <span>アンインストール(<u>U</u>)</span>
      </button>

      <hr class="menu-separator main-only" />

      <!-- メイン専用: RSS/プラグイン/メールチェック/倍率/機能/設定 -->
      <button type="button" class="menu-item main-only" id="headlines-btn" role="menuitem">
        <span>RSS/ヘッドライン(<u>H</u>)</span>
      </button>

      <button type="button" class="menu-item main-only has-submenu" id="plugin-btn" role="menuitem" aria-haspopup="true">
        <span>プラグイン(<u>P</u>)</span>
      </button>

      <button type="button" class="menu-item main-only" id="biff-btn" role="menuitem">
        <span>メールチェック (<u>M</u>)</span>
      </button>

      <button type="button" class="menu-item main-only has-submenu" id="shell-scale-root-btn" role="menuitem" aria-haspopup="true">
        <span>シェル倍率(<u>E</u>)</span>
      </button>

      <button type="button" class="menu-item main-only has-submenu" id="balloon-scale-btn" role="menuitem" aria-haspopup="true">
        <span>バルーン倍率(<u>D</u>)</span>
      </button>

      <button type="button" class="menu-item main-only has-submenu" id="utility-root-btn" role="menuitem" aria-haspopup="true">
        <span>機能(<u>F</u>)</span>
      </button>

      <button type="button" class="menu-item main-only" id="config-btn" role="menuitem">
        <span>設定(<u>O</u>)</span>
      </button>

      <button type="button" class="menu-item main-only" id="config-ghost-btn" role="menuitem">
        <span>詳細設定(ゴーストごとの設定) (D)...</span>
      </button>

      <hr class="menu-separator main-only" />

      <!-- メイン専用: ゴースト切り替え / 他のゴーストを呼ぶ / シェル -->
      <button type="button" class="menu-item main-only has-submenu" id="ghost-btn" role="menuitem" aria-haspopup="true">
        <span>ゴースト切り替え(<u>G</u>)</span>
      </button>

      <button type="button" class="menu-item main-only has-submenu" id="call-ghost-btn" role="menuitem">
        <span>他のゴーストを呼ぶ(<u>Z</u>)</span>
      </button>

      <button type="button" class="menu-item main-only has-submenu" id="shell-btn" role="menuitem" aria-haspopup="true">
        <span>シェル(<u>S</u>)</span>
      </button>

      <!-- 共通: 着せ替え (Scope 0 & Scope >= 1) -->
      <button type="button" class="menu-item has-submenu" id="dressup-btn" role="menuitem" aria-haspopup="true">
        <span>着せ替え(<u>C</u>)</span>
      </button>

      <!-- メイン専用: バルーン / 最近使ったもの -->
      <button type="button" class="menu-item main-only has-submenu" id="balloon-btn" role="menuitem" aria-haspopup="true">
        <span>バルーン(<u>B</u>)</span>
      </button>

      <button type="button" class="menu-item main-only has-submenu" id="ghost-history-btn" role="menuitem">
        <span>最近使ったもの(<u>Y</u>)</span>
      </button>

      <hr class="menu-separator" />

      <!-- メイン専用: 情報 / Language / アイコン化 -->
      <button type="button" class="menu-item main-only" id="inquire-btn" role="menuitem">
        <span>情報(<u>A</u>)</span>
      </button>

      <button type="button" class="menu-item main-only" id="language-btn" role="menuitem">
        <span>Language</span>
      </button>

      <button type="button" class="menu-item main-only" id="minimize-btn" role="menuitem">
        <span>アイコン化 (<u>I</u>)</span>
      </button>

      <hr class="menu-separator main-only" />

      <!-- 共通: ゴースト本体移動 (Scope 0 & Scope >= 1) -->
      <button type="button" class="menu-item" id="move-ghost-btn" role="menuitem">
        <span>ゴースト本体移動</span>
      </button>

      <hr class="menu-separator" />

      <!-- 共通: 終了 (Scope 0 & Scope >= 1) -->
      <button type="button" class="menu-item" id="close-btn" role="menuitem">
        <span>終了(W)Ctrl+W</span>
      </button>

      <!-- 共通: 全て終了 (Scope 0 & Scope >= 1) -->
      <button type="button" class="menu-item" id="close-all-btn" role="menuitem">
        <span>全て終了(X)Ctrl+Q</span>
      </button>
    </div>
  </body>
</html>
