[package]
name = "nanai-android-mascot"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nanai_android_mascot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
encoding_rs = "0.8.42"
nanai_android_mascot_ui = { package = "nanai-android-mascot-ui", path = "../crates/ui" }
# SHIORI連携用 - C++統合
libc = "0.2.191"
regex = "1.13.1"
walkdir = "2.5.0"
# 文字列処理とメモリ管理
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
base64 = "0.23.1"
libloading = "0.9.0"
toml = "1.1.8"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
md-5 = "0.11.0"
parking_lot = "0.13.0"
thiserror = "2.0.21"
anyhow = "1.0.104"
tauri-plugin-dialog = "2"
