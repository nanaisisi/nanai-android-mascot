<!doctype html>
<html lang="ja" data-balloon-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanai Android Mascot Context Menu</title>
    <link rel="stylesheet" href="css/context-menu.css" />
    <script type="module" src="ts/ui/context-menu.ts"></script>
  </head>
  <body class="balloon-theme-default">
    <div class="menu-sidebar" id="menu-sidebar" aria-hidden="true"></div>
    <div class="menu-container" role="menu" aria-label="標準メニュー">
      <!-- ================================================================= -->
      <!-- ssp-menu-exact-spec.md 準拠：Scope 0 (メイン) 及び Scope >= 1 (サブ) メニュー構造 -->
      <!-- ================================================================= -->

      <!-- 共通: おともだち (Scope 0 & Scope >= 1) -->
      <button type="button" class="menu-item" id="friends-btn" role="menuitem">
        <span>おともだち</span>
      </button>

      <!-- メイン専用: おきにいり / こうしん -->
      <button type="button" class="menu-item main-only" id="favorite-btn" role="menuitem">
        <span>おきにいり</span>
      </button>

      <button type="button" class="menu-item main-only" id="update-btn" role="menuitem">
        <span>こうしんCtrl+U</span>
      </button>

      <hr class="menu-separator main-only" />

      <!-- メイン専用: アンインストール -->
      <button type="button" class="menu-item main-only" id="uninstall-btn" role="menuitem">
        <span>アンインストール(U)</span>
      </button>

      <hr class="menu-separator main-only" />

      <!-- メイン専用: RSS/プラグイン/メールチェック/倍率/機能/設定 -->
      <button type="button" class="menu-item main-only" id="headlines-btn" role="menuitem">
        <span>RSS/ヘッドライン(H)</span>
      </button>

      <button type="button" class="menu-item main-only" id="plugin-btn" role="menuitem" aria-haspopup="true">
        <span>プラグイン(P)</span>
      </button>

      <button type="button" class="menu-item main-only" id="biff-btn" role="menuitem">
        <span>メールチェック (M)</span>
      </button>

      <button type="button" class="menu-item main-only" id="shell-scale-root-btn" role="menuitem">
        <span>シェル倍率(E)</span>
      </button>

      <button type="button" class="menu-item main-only" id="balloon-scale-btn" role="menuitem">
        <span>バルーン倍率(D)</span>
      </button>

      <button type="button" class="menu-item main-only" id="utility-root-btn" role="menuitem">
        <span>機能(E)</span>
      </button>

      <button type="button" class="menu-item main-only" id="config-btn" role="menuitem">
        <span>設定(Q)</span>
      </button>

      <hr class="menu-separator main-only" />

      <!-- メイン専用: ゴースト切り替え / 他のゴーストを呼ぶ / シェル -->
      <button type="button" class="menu-item main-only" id="ghost-btn" role="menuitem" aria-haspopup="true">
        <span>ゴースト切り替え(G)</span>
      </button>

      <button type="button" class="menu-item main-only" id="call-ghost-btn" role="menuitem">
        <span>他のゴーストを呼ぶ(乙)</span>
      </button>

      <button type="button" class="menu-item main-only" id="shell-btn" role="menuitem" aria-haspopup="true">
        <span>シェル(S)</span>
      </button>

      <!-- 共通: 着せ替え (Scope 0 & Scope >= 1) -->
      <button type="button" class="menu-item" id="dressup-btn" role="menuitem" aria-haspopup="true">
        <span>着せ替え(C)</span>
      </button>

      <!-- メイン専用: バルーン / 最近使ったもの -->
      <button type="button" class="menu-item main-only" id="balloon-btn" role="menuitem" aria-haspopup="true">
        <span>バルーン(B)</span>
      </button>

      <button type="button" class="menu-item main-only" id="ghost-history-btn" role="menuitem">
        <span>最近使ったもの(Y)</span>
      </button>

      <hr class="menu-separator" />

      <!-- メイン専用: 情報 / Language / アイコン化 -->
      <button type="button" class="menu-item main-only" id="inquire-btn" role="menuitem">
        <span>情報(A)</span>
      </button>

      <button type="button" class="menu-item main-only" id="language-btn" role="menuitem">
        <span>Language</span>
      </button>

      <button type="button" class="menu-item main-only" id="minimize-btn" role="menuitem">
        <span>アイコン化 (1)Ctrl+1</span>
      </button>

      <hr class="menu-separator main-only" />

      <!-- 共通: ゴースト本体移動 (Scope 0 & Scope >= 1) -->
      <button type="button" class="menu-item" id="move-ghost-btn" role="menuitem">
        <span>ゴースト本体移動</span>
      </button>

      <hr class="menu-separator" />

      <!-- 共通: 終了 (Scope 0 & Scope >= 1) -->
      <button type="button" class="menu-item" id="close-btn" role="menuitem">
        <span>終了(W)Ctrl+W</span>
      </button>

      <!-- 共通: 全て終了 (Scope 0 & Scope >= 1) -->
      <button type="button" class="menu-item" id="close-all-btn" role="menuitem">
        <span>全て終了(X)Ctrl+Q</span>
      </button>
    </div>
  </body>
</html>
