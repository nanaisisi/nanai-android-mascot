<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Test</title>
    <link rel="stylesheet" href="css/test-menu.css" />
    <style>
      .compliance-launcher {
        margin: 1rem;
        padding: 1rem;
        max-width: 34rem;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.08);
      }
      .compliance-launcher p {
        margin: 0 0 0.75rem 0;
        font-size: 0.875rem;
        color: #374151;
      }
      .compliance-launcher button,
      #test-menu-run-compliance-btn {
        padding: 0.5rem 0.9rem;
        border: 1px solid #2563eb;
        border-radius: 0.375rem;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font-size: 0.85rem;
      }
      .modal-content.compliance-wide {
        max-width: min(92vw, 56rem);
        max-height: 85vh;
        overflow-y: auto;
      }
      .compliance-badge {
        display: inline-block;
        padding: 0.2rem 0.5rem;
        border-radius: 0.25rem;
        background: #f3f4f6;
        font-size: 0.8rem;
      }
      .compliance-badge.pass {
        background: #dcfce7;
        color: #166534;
      }
      .compliance-badge.fail {
        background: #fee2e2;
        color: #991b1b;
      }
      .compliance-table td {
        padding: 0.45rem 0.35rem;
        border-bottom: 1px solid #e5e7eb;
        vertical-align: top;
      }
      .compliance-usage code {
        font-size: 0.72rem;
        color: #334155;
        word-break: break-word;
      }
      .compliance-hint {
        margin-top: 0.25rem;
        font-size: 0.72rem;
        color: #4b5563;
      }
    </style>
    <script type="module" src="ts/ui/test-menu.ts"></script>
  </head>
  <body>
    <h1 class="visually-hidden">メニューテスト</h1>
    <div class="compliance-launcher">
      <p>UKADOC / SSP 仕様適合・全使用部〜UI半自動確認ランナーを直接起動できます。</p>
      <button type="button" id="launch-spec-compliance-btn">
        📋 仕様適合・全使用部〜UI半自動検証を実行
      </button>
    </div>

    <div class="menu-container">
      <button type="button" class="menu-btn" onclick="toggleMenu()">☰</button>
      <div class="menu-dropdown" id="dropdown">
        <button type="button" class="menu-item" onclick="openModal('ゴースト管理')">
          👻 ゴースト管理
        </button>
        <button type="button" class="menu-item" onclick="openModal('バルーン管理')">
          💭 バルーン管理
        </button>
        <button type="button" class="menu-item" onclick="openModal('スキャン')">
          🔍 スキャン
        </button>
        <button type="button" class="menu-item" onclick="openModal('テスト')">
          🧪 テスト
        </button>
        <button type="button" class="menu-item" onclick="openModal('設定')">⚙️ 設定</button>
        <button type="button" class="menu-item" onclick="openModal('デバッグ')">
          🐛 デバッグ
        </button>
        <button type="button" class="menu-item" onclick="openModal('ヘルプ')">
          ❓ ヘルプ
        </button>
      </div>
    </div>

    <div class="modal" id="modal">
      <div class="modal-content">
        <button type="button" class="close-btn" onclick="closeModal()">&times;</button>
        <div id="modal-text">モーダル内容がここに表示されます</div>
      </div>
    </div>
  </body>
</html>
