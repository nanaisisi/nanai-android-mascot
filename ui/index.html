<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>Nanai Android Mascot</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes, viewport-fit=cover"
    />

    <!-- Android向け最適化 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- 透過マスコットアプリスタイル -->
    <link rel="stylesheet" href="styles.css" />

    <!-- メインコントローラ（ESモジュール） -->
    <script type="module" src="/main.js"></script>
  </head>

  <body>
    <!-- 透過背景マスコットアプリ -->
    <h1 class="visually-hidden">Nanai Android Mascot - 透過マスコットアプリ</h1>
    <div class="container">
      <!-- 右上メニューボタン -->
      <div class="top-right-menu">
        <button
          type="button"
          class="menu-btn"
          id="menu-btn"
          title="メニュー"
        >
          ☰
        </button>
        <!-- iframeメニュー -->
        <div
          class="menu-iframe-container"
          id="menu-iframe-container"
          style="display: none"
        >
          <iframe
            id="menu-iframe"
            src="menu-iframe.html"
            width="460"
            height="580"
            title="メニューオプション"
            loading="lazy"
            style="border: none; background: transparent;"
          >
          </iframe>
        </div>
      </div>

      <!-- メイン表示エリア（ゴースト・バルーン表示） -->
      <div class="main-display">
        <!-- 0番手: sakura スロット（キャラ + バルーン） -->
        <div class="character-slot sakura-slot" id="sakura-slot">
          <!-- バルーン表示 (0番: sakura用) -->
          <div class="balloon-display" id="balloon-display" style="display: none">
            <div class="balloon">
              <div class="balloon-text" id="balloon-text">
                こんにちは！マスコットナナイです。
              </div>
            </div>
          </div>

          <!-- ゴーストキャラクター表示（0番: sakura） -->
          <div class="ghost-display" id="ghost-display">
            <div class="ghost-character" id="ghost-character">
              <span class="character-placeholder" id="sakura-placeholder"></span>
            </div>
            <!-- クイックメニューはゴーストタップや右上メニューから十分利用可能なため常時ボタンを撤去 -->
          </div>
        </div>

        <!-- 1番手: kero スロット（サブキャラ + バルーン） -->
        <div class="character-slot kero-slot" id="kero-slot" style="display: none;">
          <!-- バルーン表示 (1番: kero用) -->
          <div class="balloon-display kero-balloon" id="kero-balloon-display" style="display: none">
            <div class="balloon">
              <div class="balloon-text" id="kero-balloon-text"></div>
            </div>
          </div>

          <!-- サブキャラクター表示（1番: kero） -->
          <div class="ghost-display kero-display" id="kero-display">
            <div class="ghost-character" id="kero-character">
              <span class="character-placeholder" id="kero-placeholder"></span>
            </div>
          </div>
        </div>

        <!-- ステータス表示 -->
        <div class="status-bar" id="status-bar" style="display: none">
          <span class="status-indicator" id="connection-status"></span>
          <span id="status-text"></span>
        </div>
      </div>
    </div>

    <!-- モーダルオーバーレイ -->
    <div class="modal-overlay" id="modal-overlay" style="display: none">
      <div class="modal">
        <button type="button" class="close-btn" id="modal-close">&times;</button>
        <div id="modal-content">
          <!-- モーダル内容がここに表示される -->
        </div>
      </div>
    </div>

  </body>
</html>
