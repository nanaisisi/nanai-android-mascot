<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>Nanai Android Mascot</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="../assets/nam-icon.svg" />

    <!-- Android向け最適化 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- 透過マスコットアプリスタイル -->
    <link rel="stylesheet" href="styles.css" />

    <!-- メインコントローラ（ESモジュール） -->
    <script type="module" src="./main.ts"></script>
  </head>

  <body>
    <!-- 透過背景マスコットアプリ -->
    <h1 class="visually-hidden">Nanai Android Mascot - 透過マスコットアプリ</h1>
    <div class="container">
      <!-- 右上メニューボタン -->
      <div class="top-right-menu">
        <button
          type="button"
          class="menu-btn"
          id="menu-btn"
          title="メニュー"
        >
          ☰
        </button>
        <button
          type="button"
          class="menu-btn android-menu-btn"
          id="android-menu-btn"
          title="Android用メニュー"
          aria-haspopup="true"
          aria-expanded="false"
        >
          📱
        </button>
        <div
          class="android-menu-panel"
          id="android-menu-panel"
          role="menu"
          aria-label="Android用メニュー"
          hidden
        >
          <button type="button" class="android-menu-item" data-android-action="import-nar" role="menuitem">
            📦 ゴースト取り込み (.nar)
          </button>
          <button type="button" class="android-menu-item" data-android-action="ghost-manager" role="menuitem">
            👻 ゴースト管理
          </button>
          <button type="button" class="android-menu-item" data-android-action="balloon-manager" role="menuitem">
            💬 バルーン管理
          </button>
          <hr class="android-menu-separator" />
          <div class="android-menu-scale-group">
            <div class="android-menu-scale-row">
              <span class="android-menu-scale-label">📐 シェル倍率</span>
              <span class="android-menu-scale-value" id="android-shell-scale-value">100%</span>
            </div>
            <div class="android-menu-scale-controls">
              <button type="button" class="android-scale-btn" data-android-scale="shell:-25" aria-label="シェル縮小 (-25%)">-25%</button>
              <button type="button" class="android-scale-btn" data-android-scale="shell:100">100%</button>
              <button type="button" class="android-scale-btn" data-android-scale="shell:+25" aria-label="シェル拡大 (+25%)">+25%</button>
              <button type="button" class="android-scale-btn" data-android-action="shell-scale-other">詳細</button>
            </div>
          </div>
          <div class="android-menu-scale-group">
            <div class="android-menu-scale-row">
              <span class="android-menu-scale-label">🗨️ バルーン倍率</span>
              <span class="android-menu-scale-value" id="android-balloon-scale-value">100%</span>
            </div>
            <div class="android-menu-scale-controls">
              <button type="button" class="android-scale-btn" data-android-scale="balloon:-25" aria-label="バルーン縮小 (-25%)">-25%</button>
              <button type="button" class="android-scale-btn" data-android-scale="balloon:100">100%</button>
              <button type="button" class="android-scale-btn" data-android-scale="balloon:+25" aria-label="バルーン拡大 (+25%)">+25%</button>
              <button type="button" class="android-scale-btn" data-android-action="balloon-scale-other">詳細</button>
            </div>
          </div>
          <hr class="android-menu-separator" />
          <button type="button" class="android-menu-item" data-android-action="reset-shell-position" role="menuitem">
            📍 キャラ位置を初期化
          </button>
          <button type="button" class="android-menu-item" data-android-action="reset-balloon-position" role="menuitem">
            💭 バルーン位置を初期化
          </button>
          <button type="button" class="android-menu-item" data-android-action="settings" role="menuitem">
            ⚙️ 設定
          </button>
          <hr class="android-menu-separator" />
          <button type="button" class="android-menu-item is-danger" data-android-action="close-all" role="menuitem">
            🚪 終了
          </button>
        </div>
        <!-- iframeメニュー -->
        <div
          class="menu-iframe-container"
          id="menu-iframe-container"
          style="display: none"
        >
          <iframe
            id="menu-iframe"
            src="menu-iframe.html"
            width="460"
            height="580"
            title="メニューオプション"
            loading="lazy"
            style="border: none; background: transparent;"
          >
          </iframe>
        </div>
      </div>

      <!-- メイン表示エリア（ゴースト・バルーン表示） -->
      <div class="main-display">
        <!-- 0番手: sakura スロット（キャラ + バルーン） -->
        <div class="character-slot sakura-slot" id="sakura-slot">
          <!-- バルーン表示 (0番: sakura用) -->
          <div class="balloon-display" id="balloon-display" style="display: none">
            <div class="balloon">
              <div class="balloon-text" id="balloon-text"></div>
              <div class="balloon-scroll-arrow-up" id="balloon-arrow-up" aria-hidden="true"></div>
              <div class="balloon-scroll-arrow-down" id="balloon-arrow-down" aria-hidden="true"></div>
            </div>
          </div>

          <!-- ゴーストキャラクター表示（0番: sakura） -->
          <div class="ghost-display" id="ghost-display">
            <div class="ghost-character" id="ghost-character">
              <div class="character-placeholder" id="sakura-placeholder"></div>
            </div>
            <!-- クイックメニューはゴーストタップや右上メニューから十分利用可能なため常時ボタンを撤去 -->
          </div>
        </div>

        <!-- 1番手: kero スロット（サブキャラ + バルーン） -->
        <div class="character-slot kero-slot" id="kero-slot" style="display: none;">
          <!-- バルーン表示 (1番: kero用) -->
          <div class="balloon-display kero-balloon" id="kero-balloon-display" style="display: none">
            <div class="balloon">
              <div class="balloon-text" id="kero-balloon-text"></div>
              <div class="balloon-scroll-arrow-up" id="kero-balloon-arrow-up" aria-hidden="true"></div>
              <div class="balloon-scroll-arrow-down" id="kero-balloon-arrow-down" aria-hidden="true"></div>
            </div>
          </div>

          <!-- サブキャラクター表示（1番: kero） -->
          <div class="ghost-display kero-display" id="kero-display">
            <div class="ghost-character" id="kero-character">
              <span class="character-placeholder" id="kero-placeholder"></span>
            </div>
          </div>
        </div>

        <!-- ステータス表示 -->
        <div class="status-bar" id="status-bar" style="display: none">
          <span class="status-indicator" id="connection-status"></span>
          <span id="status-text"></span>
        </div>
      </div>
    </div>

    <!-- モーダルオーバーレイ -->
    <div class="modal-overlay" id="modal-overlay" style="display: none">
      <div class="modal">
        <button type="button" class="close-btn" id="modal-close">&times;</button>
        <div id="modal-content">
          <!-- モーダル内容がここに表示される -->
        </div>
      </div>
    </div>

  </body>
</html>
