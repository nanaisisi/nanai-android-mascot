<!DOCTYPE html>
<html lang="ja" data-balloon-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanai Submenu</title>
    <link rel="stylesheet" href="css/context-menu.css" />
    <style>
      body {
        margin: 0;
        padding: 0.25rem;
        background: transparent;
        overflow: hidden;
        font-family: var(--balloon-font-family);
        color: var(--balloon-text-color, #111111);
        user-select: none;
        -webkit-user-select: none;
      }
      .submenu-window-container {
        width: 100%;
        max-height: calc(100vh - 0.5rem);
        overflow-y: auto;
        background-color: var(--balloon-bg, #ffffff);
        background-image: var(--balloon-pattern, none);
        border: var(--balloon-border-width, 1px) var(--balloon-border-style, solid) var(--balloon-border-color, #7a7a7a);
        border-radius: var(--balloon-border-radius, 0.375rem);
        box-shadow: var(--balloon-box-shadow, 0.125rem 0.125rem 0.75rem rgba(0, 0, 0, 0.35));
        padding: 0.25rem 0;
        font-size: var(--balloon-font-size, 0.8125rem);
        color: var(--balloon-text-color, #111111);
      }
      .submenu-window-container::-webkit-scrollbar {
        width: 4px;
      }
      .submenu-window-container::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.4);
        border-radius: 2px;
      }
    </style>
  </head>
  <body class="balloon-theme-default">
    <h1 class="visually-hidden">Nanai Android Mascot サブメニュー</h1>
    <div class="submenu-window-container" id="submenu-content" role="menu" aria-busy="true">
      <!-- 動的サブメニュー項目挿入エリア -->
    </div>
    <script type="module" src="js/ui/submenu.js"></script>
  </body>
</html>
