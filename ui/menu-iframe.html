<!doctype html>
<html lang="ja" data-balloon-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanai Android Mascot Context Menu</title>
    <link rel="stylesheet" href="css/context-menu.css" />
    <script type="module" src="ts/ui/context-menu.ts"></script>
  </head>
  <body class="balloon-theme-default">
    <div class="menu-sidebar" id="menu-sidebar" aria-hidden="true"></div>
    <div class="menu-container" role="menu">
      <h1 class="visually-hidden">Nanai Android Mascot 標準メニュー (SSPベース)</h1>
      <!-- ================================================================= -->
      <!-- SSP 互換右クリックメニュー階層構造定義 (HTML仕様表現) -->
      <!-- ================================================================= -->

      <!-- 0. ゴースト側メニュー -->
      <button
        type="button"
        class="menu-item main-only"
        id="talk-btn"
        role="menuitem"
      >
        <span>💬 もう一度話す (A)</span>
      </button>

      <button
        type="button"
        class="menu-item main-only"
        id="autotalk-btn"
        role="menuitem"
      >
        <span>🗣️ 自動会話 (T)</span>
      </button>

      <button
        type="button"
        class="menu-item main-only"
        id="biff-btn"
        role="menuitem"
      >
        <span>✉️ メールチェック (B)</span>
      </button>

      <button
        type="button"
        class="menu-item main-only"
        id="headlines-btn"
        role="menuitem"
      >
        <span>🌐 ヘッドライン (H)</span>
      </button>

      <hr class="menu-separator main-only" />

      <button
        type="button"
        class="menu-item"
        id="dressup-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>👗 着せ替え (D)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="shell-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>🐚 シェル切替 (S)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="ghost-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>👻 ゴースト切替 (G)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="balloon-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>💭 バルーン切替 (L)</span>
      </button>

      <hr class="menu-separator" />

      <button
        type="button"
        class="menu-item"
        id="update-btn"
        role="menuitem"
      >
        <span>🔄 ネットワーク更新 (U)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="export-btn"
        role="menuitem"
      >
        <span>📦 ゴースト・バルーン取込 (I)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="uninstall-btn"
        role="menuitem"
      >
        <span>🗑️ アンインストール (X)</span>
      </button>

      <hr class="menu-separator" />

      <button
        type="button"
        class="menu-item"
        id="inquire-btn"
        role="menuitem"
      >
        <span>❓ 質問・情報 (I)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="readme-btn"
        role="menuitem"
      >
        <span>📖 リードミー (R)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="config-btn"
        role="menuitem"
      >
        <span>⚙️ 設定 (C)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="dev-btn"
        role="menuitem"
      >
        <span>🛠️ 開発者パネル (P)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="sakura-script-btn"
        role="menuitem"
      >
        <span>⌨️ さくらスクリプトテスト</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="plugin-btn"
        role="menuitem"
        aria-haspopup="true"
      >
        <span>🔌 プラグイン</span>
      </button>

      <hr class="menu-separator" />

      <button
        type="button"
        class="menu-item"
        id="minimize-btn"
        role="menuitem"
      >
        <span>🗕 最小化 (M)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="close-btn"
        role="menuitem"
      >
        <span>❌ 終了 (E)</span>
      </button>

      <button
        type="button"
        class="menu-item"
        id="close-all-btn"
        role="menuitem"
      >
        <span>⏹️ 全終了 (Q)</span>
      </button>
    </div>
  </body>
</html>
